name: Issue
description: Report a problem or request a change to Zen Bonsai.
body:
  - type: markdown
    attributes:
      value: |
        Issues are welcome from everyone, including installation and packaging reports.
        Please search existing issues first. Don't include passwords or other private data.
  - type: textarea
    id: what-happened
    attributes:
      label: Description
      description: What went wrong, or what would you like to change? For a bug, include what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: Steps to reproduce
      description: For bugs, list the steps. Screenshots or relevant logs can help.
  - type: input
    id: version
    attributes:
      label: Bonsai version
      description: If relevant, copy the version from Help > About Zen Bonsai.
      placeholder: 1.24.1b-bonsai.1
  - type: input
    id: platform
    attributes:
      label: Operating system and install method
      placeholder: For example, Windows 11 installer or Arch Linux AUR package
